[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# El digest diario de stock bajo (alertas-stock-email) ya no tiene schedule de
# Netlify: lo dispara pg_cron con un secreto (migracion 20260926090000).

# Cabeceras de seguridad para todo el sitio. Sin Content-Security-Policy a
# proposito: las paginas usan scripts inline y modulos de jsdelivr, una CSP
# estricta hay que probarla pagina por pagina antes de activarla. frame-ancestors
# solo evita el clickjacking (no restringe scripts). La camara queda permitida
# para el lector de codigo de barras.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
