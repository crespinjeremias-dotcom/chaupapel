<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión</title>
<link rel="stylesheet" href="css/chaupapel.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1f6f50" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<script type="module">
  import { registrarServiceWorker, escucharPromptInstalacion } from './js/pwa.js';
  registrarServiceWorker();
  escucharPromptInstalacion();
</script>

<div class="contenedor-auth">
  <div class="tarjeta">
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Accedé a tu cuenta del local.</p>

    <p class="mensaje-error" id="error" hidden></p>

    <div class="aviso" id="aviso-sesion" hidden>
      Ya había una sesión abierta en otro dispositivo.
      <div class="acciones">
        <button type="button" id="btn-cerrar-anterior">Cerrar sesión anterior y continuar</button>
        <button type="button" id="btn-mantener-ambas">Mantener ambas y continuar</button>
      </div>
    </div>

    <form id="form-login">
      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="boton-primario" id="btn-submit">Iniciar sesión</button>
    </form>

    <div class="enlaces">
      <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
      <a href="registro.html">¿No tenés cuenta? Registrar mi negocio</a>
      <a href="empleado.html">¿Tenés un código de invitación? Registrate como empleado</a>
    </div>

    <button type="button" class="boton-secundario boton-instalar-login" id="btn-instalar-login" hidden>Instalar app en esta compu</button>
  </div>
</div>

<script type="module">
  import {
    login,
    registrarSesionActual,
    cerrarSesionesAnteriores,
    obtenerUsuarioActual,
    obtenerSuperAdminActual,
    pantallaDeEntrada,
    logout,
  } from './js/auth.js';
  import { mostrarError, mostrarCargando, traducirError } from './js/utils.js';
  import { conectarBotonInstalar } from './js/pwa.js';

  const form = document.getElementById('form-login');
  const errorEl = document.getElementById('error');
  const avisoSesion = document.getElementById('aviso-sesion');
  const btnSubmit = document.getElementById('btn-submit');

  conectarBotonInstalar(document.getElementById('btn-instalar-login'));

  // El Super-Admin no tiene fila en `usuarios` (no pertenece a ninguna
  // organizacion), asi que se chequea aparte y primero -- si se lo dejara
  // caer en la logica normal, pantallaDeEntrada() con usuario=null lo
  // mandaria de vuelta a index.html (loop de login).
  // Devuelve a donde ir, o null si la cuenta ya no existe: una cuenta de Auth
  // que no es super-admin y no tiene fila en `usuarios` es la de una
  // organizacion que se borro. Auth igual la deja iniciar sesion (el borrado
  // de las tablas no toca auth.users salvo que se borre aparte), asi que sin
  // este chequeo pantallaDeEntrada(null) la mandaba de vuelta a esta misma
  // pantalla en silencio: parecia que "entraba" pero sin ningun mensaje.
  async function resolverDestino() {
    const superAdmin = await obtenerSuperAdminActual();
    if (superAdmin) return 'superadmin.html';
    const usuario = await obtenerUsuarioActual();
    return usuario ? pantallaDeEntrada(usuario) : null;
  }

  async function rechazarCuentaInexistente() {
    await logout();
    form.hidden = false;
    avisoSesion.hidden = true;
    mostrarError(errorEl, 'Esta cuenta ya no existe. Si creés que es un error, contactá al administrador del sistema.');
    mostrarCargando(btnSubmit, false, 'Iniciar sesión');
  }

  async function irAPantallaDeEntrada() {
    const destino = await resolverDestino();
    if (destino === null) {
      await rechazarCuentaInexistente();
      return;
    }
    window.location.href = destino;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    mostrarError(errorEl, '');
    mostrarCargando(btnSubmit, true, 'Iniciar sesión');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await login(email, password);
    if (error) {
      mostrarError(errorEl, traducirError(error));
      mostrarCargando(btnSubmit, false, 'Iniciar sesión');
      return;
    }

    // Antes de registrar la sesion o mostrar el aviso de "otra sesion abierta":
    // si la cuenta ya no existe no tiene sentido seguir.
    try {
      if ((await resolverDestino()) === null) {
        await rechazarCuentaInexistente();
        return;
      }
    } catch (err) {
      mostrarError(errorEl, `No se pudo continuar: ${err.message}`);
      mostrarCargando(btnSubmit, false, 'Iniciar sesión');
      return;
    }

    try {
      const huboSesionPrevia = await registrarSesionActual();
      if (huboSesionPrevia) {
        form.hidden = true;
        avisoSesion.hidden = false;
        return;
      }
    } catch {
      // si falla el chequeo de sesion unica, no bloqueamos el login por eso
    }

    try {
      await irAPantallaDeEntrada();
    } catch (err) {
      mostrarError(errorEl, `No se pudo continuar: ${err.message}`);
      mostrarCargando(btnSubmit, false, 'Iniciar sesión');
    }
  });

  // Los dos botones terminan en irAPantallaDeEntrada(), que consulta la base y
  // puede fallar (ej. error de red o de la consulta). Sin este manejo el
  // error quedaba como promesa rechazada sin capturar: el usuario veia los
  // botones sin reaccion y sin ningun mensaje.
  async function continuarDesdeAvisoDeSesion(accionPrevia) {
    const botones = avisoSesion.querySelectorAll('button');
    mostrarError(errorEl, '');
    botones.forEach((b) => (b.disabled = true));
    try {
      if (accionPrevia) {
        const { error } = await accionPrevia();
        if (error) throw error;
      }
      await irAPantallaDeEntrada();
    } catch (err) {
      mostrarError(errorEl, `No se pudo continuar: ${err.message}`);
      botones.forEach((b) => (b.disabled = false));
    }
  }

  document.getElementById('btn-cerrar-anterior').addEventListener('click', () => continuarDesdeAvisoDeSesion(cerrarSesionesAnteriores));
  document.getElementById('btn-mantener-ambas').addEventListener('click', () => continuarDesdeAvisoDeSesion(null));
</script>
